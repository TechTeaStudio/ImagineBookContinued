# Builds ImagineBook Continued, runs its tests and checks that every Mixin applies.
#
# Triggers: push and pull_request to `product` (the studio release branch) and `v*` tags.
# A `v*` tag also creates a GitHub Release with the mod jar and its sources jar: the mod is
# LGPL-3.0-only, so the sources travel with every published binary.
#
# One job on one runner on purpose: the repository is private and Actions minutes are counted.
# CiWorkflowTest pins this file against the house rules.

name: Build

on:
  push:
    branches: ["product"]
    tags: ["v*"]
  pull_request:
    branches: ["product"]

permissions:
  contents: write  # softprops/action-gh-release creates the release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: bash ./gradlew build

      # Loads the patched Minecraft classes in preLaunch, before a window exists, and fails on any
      # Mixin that did not apply. Asset download is skipped because no frame is ever drawn.
      - name: Check that every Mixin applies
        run: bash ./gradlew runMixinSmoke -x downloadAssets

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: imaginebook-continued
          path: build/libs/imaginebook-continued-fabric-*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/imaginebook-continued-fabric-*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
