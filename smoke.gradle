// A separate development-only mod validates Mixin transformations without opening a window.
sourceSets {
    // Sources live in the defaults, src/smoke/java and src/smoke/resources. Adding them a second time
    // listed fabric.mod.json twice and failed processSmokeResources on CI (1.3.0.1).
    smoke {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
def smokeJar = tasks.register('smokeJar', Jar) {
    archiveClassifier = 'smoke-test'
    // Kept out of build/libs, which CI uploads and releases as it is.
    destinationDirectory = layout.buildDirectory.dir('smoke-libs')
    from sourceSets.smoke.output
}
loom.runs {
    mixinSmoke {
        client()
        vmArg "-Dfabric.addMods=${smokeJar.get().archiveFile.get().asFile.absolutePath}"
        vmArg '-Dmixin.debug.countInjections=true'
        runDir 'build/mixin-smoke'
    }
}
tasks.named('runMixinSmoke') { dependsOn smokeJar }
